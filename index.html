<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05020c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuner">
<meta name="description" content="Chromatic and string guitar tuner that runs in the browser. Synthwave edition.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<title>Guitar Tuner</title>
<style>
  /* ============================================================
     Palette lifted off the Vortex 84 poster
     ============================================================ */
  :root {
    --void: #05020c;
    --void-2: #0b0518;
    --magenta: #ff2d95;
    --pink: #ff5cc8;
    --cyan: #22d3ee;
    --blue: #2b6cff;
    --violet: #7c3aed;
    --orange: #ff6a1f;
    --amber: #ffb020;
    --green: #4ade80;
    --text: #efe9ff;
    --dim: #a596cf;
    --dimmer: #6f61a0;
    --panel: rgba(11, 5, 24, 0.72);
    --line: rgba(165, 150, 207, 0.28);
    --good: var(--green);
    --near: var(--amber);
    --far: var(--magenta);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void);
    color: var(--text);
    font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  .mono { font-family: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }

  /* ---------- fixed background layers ---------- */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .scan {
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.30) 2px 3px);
    opacity: .45; mix-blend-mode: multiply;
  }
  .sweep {
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(180,220,255,.055) 46%, rgba(255,255,255,0) 100%);
    height: 34vh; top: -34vh; bottom: auto;
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep { to { transform: translateY(140vh); } }
  .vig {
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%),
      radial-gradient(60% 40% at 50% 100%, rgba(124,58,237,.16), rgba(0,0,0,0) 70%);
  }
  .scrim {
    z-index: 1;
    background: linear-gradient(180deg, rgba(5,2,12,.10) 0%, rgba(5,2,12,.35) 35%, rgba(5,2,12,.55) 60%, rgba(5,2,12,.45) 100%);
  }
  @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }

  /* ---------- layout ---------- */
  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-rows: auto auto 1fr auto auto auto;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);
    max-width: 520px;
    margin: 0 auto;
  }

  /* title bar */
  .bar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .mark {
    font-family: 'Orbitron', Impact, 'Arial Black', sans-serif;
    font-weight: 900; font-size: 1.05rem; letter-spacing: .16em; text-transform: uppercase;
    background: linear-gradient(178deg, #f4fbff 0%, #a8e2ff 22%, #3f86ff 44%, #12224d 51%, #ff2d95 70%, #ffc4e9 92%, #fff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 8px rgba(255,45,149,.55)) drop-shadow(0 0 22px rgba(43,108,255,.35));
    transform: skewX(-6deg); display: inline-block;
  }
  .eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: .62rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--cyan); opacity: .9;
    font-variant-numeric: tabular-nums;
  }

  /* controls */
  header { display: flex; gap: 8px; align-items: center; }
  .select { position: relative; flex: 1; min-width: 0; }
  .select select {
    width: 100%; appearance: none; -webkit-appearance: none;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 40px 12px 14px;
    font-family: 'Share Tech Mono', monospace; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .select::after {
    content: ""; position: absolute; right: 16px; top: 50%;
    width: 8px; height: 8px;
    border-right: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  .btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; min-height: 46px;
    font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color 120ms, color 120ms, box-shadow 120ms;
  }
  .btn:active { background: rgba(30, 14, 50, .85); }
  .btn.icon { width: 46px; padding: 0; font-size: 20px; line-height: 1; }
  .btn.on { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(34,211,238,.35), inset 0 0 10px rgba(34,211,238,.12); }

  /* gauge */
  .gauge { position: relative; display: grid; align-content: center; justify-items: center; min-height: 0; }
  .gauge svg { width: 100%; max-width: 440px; height: auto; display: block; overflow: visible; }
  .needle {
    transform-origin: 150px 150px; transform: rotate(0deg);
    transition: transform 90ms linear;
    filter: drop-shadow(0 0 6px var(--nc, var(--magenta))) drop-shadow(0 0 16px var(--nc, var(--magenta)));
  }
  .needle line, .needle circle { stroke: #fff; fill: #fff; transition: stroke 150ms, fill 150ms; }
  .readout { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; pointer-events: none; }
  .note {
    font-family: 'Orbitron', Impact, 'Arial Black', sans-serif;
    font-size: clamp(64px, 20vw, 104px); font-weight: 900; line-height: 1; letter-spacing: -.01em;
    color: #fff;
    text-shadow: 0 0 5px #fff, 0 0 16px var(--nc, var(--magenta)), 0 0 38px var(--nc, var(--magenta)), 0 0 80px var(--nc, var(--magenta));
    transition: text-shadow 150ms;
  }
  .note sup { font-size: .38em; font-weight: 700; vertical-align: top; margin-left: 3px; color: var(--dim); text-shadow: none; }
  .cents {
    margin-top: 8px;
    font-family: 'Share Tech Mono', monospace; font-size: 18px; letter-spacing: .18em; text-transform: uppercase;
    font-variant-numeric: tabular-nums; color: var(--dim);
  }
  .hz { margin-top: 4px; font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: .12em; color: var(--dimmer); font-variant-numeric: tabular-nums; }
  .gauge.idle .note { opacity: .3; text-shadow: none; }
  .gauge.idle .cents, .gauge.idle .hz { opacity: .35; }
  .gauge.idle .needle { opacity: .35; filter: none; }

  /* start overlay */
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; }
  .overlay button {
    background: transparent; color: #fff;
    border: 1px solid var(--cyan); border-radius: 4px;
    padding: 18px 34px;
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--cyan);
    box-shadow: 0 0 18px rgba(34,211,238,.45), inset 0 0 18px rgba(34,211,238,.18);
    cursor: pointer;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .overlay button:active { transform: scale(.98); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(34,211,238,.45), inset 0 0 18px rgba(34,211,238,.18); }
    50% { box-shadow: 0 0 34px rgba(34,211,238,.8), inset 0 0 26px rgba(34,211,238,.3); }
  }
  @media (prefers-reduced-motion: reduce) { .overlay button { animation: none; } }

  /* strings */
  .strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; transition: opacity 150ms; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 0 8px; text-align: center; cursor: pointer; position: relative;
    color: var(--text);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color 120ms, box-shadow 120ms;
  }
  .chip .n { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; line-height: 1; }
  .chip .n sup { font-size: 10px; color: var(--dim); font-weight: 500; margin-left: 1px; }
  .chip .f { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--dimmer); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .chip.active { border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,45,149,.45), inset 0 0 10px rgba(255,45,149,.15); }
  .chip.active .n { text-shadow: 0 0 8px var(--magenta); }
  .chip.tuned { border-color: var(--green); box-shadow: 0 0 14px rgba(74,222,128,.55), inset 0 0 12px rgba(74,222,128,.18); }
  .chip.tuned .n { color: #fff; text-shadow: 0 0 6px #fff, 0 0 14px var(--green); }
  .chip.locked::after {
    content: ""; position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  }

  /* footer */
  footer { display: flex; gap: 8px; align-items: center; justify-content: space-between; min-height: 46px; }
  .status {
    font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); flex: 1; min-height: 1.3em;
  }
  .status::before { content: "> "; color: var(--cyan); }
  .status.err { color: var(--magenta); }

  /* mic level meter */
  .meter { display: flex; align-items: center; gap: 10px; margin-top: -4px; }
  .meter .lbl { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dimmer); min-width: 28px; }
  .meter .lbl:last-child { text-align: right; min-width: 56px; }
  .meter .track { flex: 1; height: 4px; position: relative; background: rgba(165,150,207,.15); border-radius: 2px; overflow: visible; }
  .meter .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); border-radius: 2px; box-shadow: 0 0 8px rgba(34,211,238,.5); transition: width 60ms linear; }
  .meter .gate { position: absolute; top: -3px; width: 1px; height: 10px; background: var(--amber); opacity: .8; }

  /* settings dialog */
  dialog {
    background: linear-gradient(180deg, #0d0620, #05020c);
    color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 0 40px rgba(124,58,237,.35), 0 0 0 1px rgba(34,211,238,.15);
    padding: 22px; width: min(92vw, 400px); max-height: 90vh; overflow: auto;
  }
  dialog::backdrop { background: rgba(5,2,12,.75); }
  dialog h2 {
    margin: 0 0 14px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: .9rem;
    letter-spacing: .22em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 10px rgba(34,211,238,.6);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row label { font-weight: 400; font-size: 15px; }
  .row small { display: block; color: var(--dim); font-weight: 300; margin-top: 2px; font-size: 12px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 4px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--cyan);
    font-size: 20px; cursor: pointer;
  }
  .stepper output { min-width: 64px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 17px; color: #fff; font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button {
    background: rgba(255,255,255,.03); color: var(--dim); border: 0; padding: 10px 12px;
    font-family: 'Share Tech Mono', monospace; font-size: 14px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: rgba(34,211,238,.12); color: var(--cyan); text-shadow: 0 0 8px rgba(34,211,238,.7); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .link { color: var(--dimmer); font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: .12em; text-align: center; margin-top: 12px; }
  .link a { color: var(--dimmer); }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="layer scrim" aria-hidden="true"></div>

<main>
  <div class="bar">
    <span class="mark">Tuner 84</span>
    <span class="eyebrow" id="eyebrow">A4 440 Hz</span>
  </div>

  <header>
    <div class="select">
      <select id="tuning" aria-label="Tuning"></select>
    </div>
    <button class="btn" id="mode" aria-pressed="false" title="Toggle chromatic mode">Chroma</button>
    <button class="btn icon" id="settingsBtn" aria-label="Settings">⚙︎</button>
  </header>

  <section class="gauge idle" id="gauge">
    <svg viewBox="0 0 300 175" aria-hidden="true">
      <!-- outer arc -->
      <path d="M 22 150 A 128 128 0 0 1 278 150" fill="none" stroke="rgba(165,150,207,.28)" stroke-width="10" stroke-linecap="round"/>
      <g id="zones"></g>
      <g id="ticks" stroke="#6f61a0" stroke-width="2"></g>
      <g id="tickLabels" fill="#a596cf" font-size="9" text-anchor="middle" font-family="'Share Tech Mono', monospace" letter-spacing="1"></g>
      <g class="needle" id="needle">
        <line x1="150" y1="150" x2="150" y2="34" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="150" cy="150" r="7" fill="#fff"/>
      </g>
    </svg>
    <div class="readout">
      <div class="note" id="note">–</div>
      <div class="cents" id="cents">&nbsp;</div>
      <div class="hz" id="hz">&nbsp;</div>
    </div>
    <div class="overlay" id="overlay">
      <button id="start">Engage</button>
    </div>
  </section>

  <section class="strings" id="strings"></section>

  <footer>
    <div class="status" id="status">Engage, then play a string.</div>
    <button class="btn" id="stop" hidden>Stop</button>
  </footer>
  <div class="meter" aria-hidden="true">
    <span class="lbl">Mic</span>
    <div class="track"><div class="fill" id="level"></div><div class="gate" id="gateMark"></div></div>
    <span class="lbl" id="rate"></span>
  </div>
</main>

<div class="layer scan" aria-hidden="true"></div>
<div class="layer sweep" aria-hidden="true"></div>
<div class="layer vig" aria-hidden="true"></div>

<dialog id="settings">
  <h2>Settings</h2>
  <div class="row">
    <label>Reference pitch<small>A4 in Hz</small></label>
    <div class="stepper">
      <button id="refDown" aria-label="Lower reference">−</button>
      <output id="refOut">440</output>
      <button id="refUp" aria-label="Raise reference">+</button>
    </div>
  </div>
  <div class="row">
    <label>Transpose<small id="offsetHint">Shift the tuning in semitones</small></label>
    <div class="stepper">
      <button id="offDown" aria-label="Down a semitone">−</button>
      <output id="offOut">0</output>
      <button id="offUp" aria-label="Up a semitone">+</button>
    </div>
  </div>
  <div class="row">
    <label>Note names</label>
    <div class="seg" id="names">
      <button data-v="auto">Auto</button>
      <button data-v="sharp">♯</button>
      <button data-v="flat">♭</button>
    </div>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn on" id="closeBtn">Done</button>
  </div>
  <div class="link"><a href="https://github.com/juho-vehvilainen/guitar-tuner" target="_blank" rel="noopener">Source on GitHub</a></div>
</dialog>

<script>
(() => {
  'use strict';

  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Shared with the background renderer. energy = how loud, glow = how in tune.
  let energy = 0, glow = 0;

  // ---------- data ----------
  // MIDI note numbers, low string first. Standard E2 = 40.
  const TUNINGS = [
    { id: 'standard',  name: 'Standard',        notes: [40, 45, 50, 55, 59, 64] },
    { id: 'half-down', name: 'Half step down',  notes: [39, 44, 49, 54, 58, 63], flats: true },
    { id: 'full-down', name: 'Full step down',  notes: [38, 43, 48, 53, 57, 62] },
    { id: 'drop-d',    name: 'Drop D',          notes: [38, 45, 50, 55, 59, 64] },
    { id: 'drop-c',    name: 'Drop C',          notes: [36, 43, 48, 53, 57, 62] },
    { id: 'dadgad',    name: 'DADGAD',          notes: [38, 45, 50, 55, 57, 62] },
  ];
  const SHARPS = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const FLATS  = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];

  const IN_TUNE = 3;        // cents
  const NEAR = 15;          // cents
  const GATE_RMS = 0.0025;  // noise gate, low: iPhone mics are quiet and clarity does the real filtering
  const CLARITY_MIN = 0.85; // MPM clarity gate
  const HISTORY = 5;        // median window
  const HOLD_MS = 700;      // keep last reading after signal drops
  const DETECT_INTERVAL = 40; // ms between detections

  // ---------- state ----------
  const DEFAULTS = { tuning: 'standard', offset: 0, ref: 440, mode: 'string', names: 'auto' };
  let state = load();
  let locked = null; // string index or null

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem('tuner') || '{}');
      return { ...DEFAULTS, ...s };
    } catch { return { ...DEFAULTS }; }
  }
  function save() {
    try { localStorage.setItem('tuner', JSON.stringify(state)); } catch {}
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const tuning = () => TUNINGS.find(t => t.id === state.tuning) || TUNINGS[0];
  const midiToFreq = m => state.ref * Math.pow(2, (m - 69) / 12);
  const freqToMidi = f => 69 + 12 * Math.log2(f / state.ref);
  const useFlats = () => state.names === 'flat' || (state.names === 'auto' && (tuning().flats || state.offset < 0));
  function noteName(m) {
    const names = useFlats() ? FLATS : SHARPS;
    return { name: names[((m % 12) + 12) % 12], octave: Math.floor(m / 12) - 1 };
  }
  const targets = () => tuning().notes.map(n => n + state.offset);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmtHz = f => f >= 100 ? f.toFixed(1) : f.toFixed(2);

  // ---------- UI build ----------
  const tuningSel = $('tuning');
  TUNINGS.forEach(t => {
    const o = document.createElement('option');
    o.value = t.id; o.textContent = t.name;
    tuningSel.appendChild(o);
  });

  (function buildGauge() {
    const cx = 150, cy = 150, r = 128;
    const ang = c => (c / 50) * 90 * Math.PI / 180; // 0 cents points straight up
    const pt = (c, rad) => [cx + rad * Math.sin(ang(c)), cy - rad * Math.cos(ang(c))];
    const NS = 'http://www.w3.org/2000/svg';
    const arc = (c1, c2, color, op) => {
      const [x1, y1] = pt(c1, r), [x2, y2] = pt(c2, r);
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', color);
      p.setAttribute('stroke-width', '10'); p.setAttribute('stroke-linecap', 'butt');
      p.setAttribute('opacity', op);
      $('zones').appendChild(p);
    };
    arc(-50, -NEAR, '#ff2d95', '.28'); arc(NEAR, 50, '#ff2d95', '.28');
    arc(-NEAR, -IN_TUNE, '#ffb020', '.45'); arc(IN_TUNE, NEAR, '#ffb020', '.45');
    arc(-IN_TUNE, IN_TUNE, '#4ade80', '.9');
    for (let c = -50; c <= 50; c += 5) {
      const major = c % 10 === 0;
      const [x1, y1] = pt(c, r - 12), [x2, y2] = pt(c, r - (major ? 24 : 18));
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      if (c === 0) l.setAttribute('stroke', '#4ade80');
      $('ticks').appendChild(l);
      if (major && (c % 25 === 0)) {
        const [tx, ty] = pt(c, r - 36);
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', tx); t.setAttribute('y', ty + 3);
        t.textContent = c === 0 ? '0' : (c > 0 ? '+' + c : String(c));
        $('tickLabels').appendChild(t);
      }
    }
  })();

  const stringsEl = $('strings');
  function renderStrings() {
    stringsEl.innerHTML = '';
    targets().forEach((m, i) => {
      const { name, octave } = noteName(m);
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.dataset.i = i;
      chip.innerHTML = `<div class="n">${name}<sup>${octave}</sup></div><div class="f">${fmtHz(midiToFreq(m))}</div>`;
      chip.addEventListener('click', () => {
        locked = locked === i ? null : i;
        renderStrings();
        setStatus(locked === null ? 'Auto string detection.' : `Locked to string ${6 - i}.`);
      });
      if (locked === i) chip.classList.add('locked', 'active');
      stringsEl.appendChild(chip);
    });
  }

  function syncControls() {
    tuningSel.value = state.tuning;
    $('mode').classList.toggle('on', state.mode === 'chromatic');
    $('mode').setAttribute('aria-pressed', state.mode === 'chromatic');
    $('refOut').textContent = state.ref;
    $('offOut').textContent = state.offset > 0 ? '+' + state.offset : String(state.offset);
    $('offsetHint').textContent = offsetHint(state.offset);
    $('eyebrow').textContent = `A4 ${state.ref} Hz` + (state.offset ? `  ·  ${state.offset > 0 ? '+' : ''}${state.offset} st` : '');
    [...$('names').children].forEach(b => b.classList.toggle('on', b.dataset.v === state.names));
    stringsEl.style.opacity = state.mode === 'chromatic' ? 0.45 : 1;
    renderStrings();
  }
  function offsetHint(o) {
    if (o === 0) return 'Shift the tuning in semitones';
    const a = Math.abs(o);
    const steps = a === 1 ? 'half step' : a === 2 ? 'whole step' : a % 2 === 0 ? `${a / 2} steps` : `${a} semitones`;
    return `${steps} ${o < 0 ? 'down' : 'up'}`;
  }

  // ---------- controls ----------
  tuningSel.addEventListener('change', () => { state.tuning = tuningSel.value; locked = null; save(); syncControls(); });
  $('mode').addEventListener('click', () => {
    state.mode = state.mode === 'string' ? 'chromatic' : 'string'; save(); syncControls();
    setStatus(state.mode === 'chromatic' ? 'Chromatic: nearest note.' : 'String mode: nearest string.');
  });
  $('settingsBtn').addEventListener('click', () => $('settings').showModal());
  $('closeBtn').addEventListener('click', () => $('settings').close());
  $('resetBtn').addEventListener('click', () => { state = { ...DEFAULTS }; locked = null; save(); syncControls(); });
  $('refDown').addEventListener('click', () => { state.ref = clamp(state.ref - 1, 415, 466); save(); syncControls(); });
  $('refUp').addEventListener('click', () => { state.ref = clamp(state.ref + 1, 415, 466); save(); syncControls(); });
  $('offDown').addEventListener('click', () => { state.offset = clamp(state.offset - 1, -12, 12); save(); syncControls(); });
  $('offUp').addEventListener('click', () => { state.offset = clamp(state.offset + 1, -12, 12); save(); syncControls(); });
  $('names').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.names = b.dataset.v; save(); syncControls();
  });
  $('settings').addEventListener('click', e => { if (e.target === $('settings')) $('settings').close(); });

  function setStatus(msg, err = false) {
    $('status').textContent = msg;
    $('status').classList.toggle('err', err);
  }

  // ---------- audio ----------
  let ctx, analyser, stream, buf, running = false, rafId = 0, lastDetect = 0, lastGood = 0;
  let history = [];
  let wakeLock = null;
  let inTune = false;

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) { keepAwake(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
  });

  async function start() {
    if (!window.isSecureContext) {
      setStatus('Microphone needs HTTPS. Open over https:// or localhost.', true); return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('No microphone support in this browser.', true); return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      // Unlock audio inside the tap gesture (iOS requirement), then open the mic.
      const unlock = ctx || new AC();
      await unlock.resume();
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
      });
      const track = stream.getAudioTracks()[0];
      // iOS can run the mic at a different rate than the context; rebuild the context to match.
      const micRate = (track.getSettings && track.getSettings().sampleRate) || unlock.sampleRate;
      if (unlock.sampleRate !== micRate) {
        try { await unlock.close(); } catch {}
        ctx = null;
        try { ctx = new AC({ sampleRate: micRate }); } catch { ctx = new AC(); }
      } else {
        ctx = unlock;
      }
      await ctx.resume();
      const source = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      // Safari only reliably processes a graph that reaches the destination. Muted, so nothing is heard.
      const mute = ctx.createGain();
      mute.gain.value = 0;
      source.connect(analyser);
      analyser.connect(mute);
      mute.connect(ctx.destination);
      buf = new Float32Array(analyser.fftSize);
      $('rate').textContent = `${Math.round(ctx.sampleRate / 100) / 10} kHz`;
      track.addEventListener('ended', () => { if (running) { stop(); setStatus('Microphone released. Engage to continue.'); } });
      running = true;
      history = [];
      $('overlay').hidden = true;
      $('stop').hidden = false;
      $('gauge').classList.remove('idle');
      setStatus('Listening. Play a string.');
      keepAwake();
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      setStatus(denied
        ? 'Mic denied. Allow it for this site in Safari settings, then reload.'
        : `Could not start audio: ${e && e.message ? e.message : e}`, true);
    }
  }

  function stop() {
    running = false;
    inTune = false;
    cancelAnimationFrame(rafId);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
    $('overlay').hidden = false;
    $('stop').hidden = true;
    $('gauge').classList.add('idle');
    levelEl.style.width = '0%';
    showIdle();
    setStatus('Stopped.');
  }

  $('start').addEventListener('click', start);
  $('stop').addEventListener('click', stop);

  function tick(now) {
    if (!running) return;
    rafId = requestAnimationFrame(tick);
    if (now - lastDetect < DETECT_INTERVAL) return;
    lastDetect = now;

    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    energy += (clamp(rms * 6, 0, 1) - energy) * 0.25;
    levelEl.style.width = `${levelPct(rms)}%`;

    let f = null;
    if (rms >= GATE_RMS) {
      const r = detectPitch(buf, ctx.sampleRate);
      if (r && r.clarity >= CLARITY_MIN && r.freq > 50 && r.freq < 1500) f = r.freq;
    }

    if (f !== null) {
      history.push(f);
      if (history.length > HISTORY) history.shift();
      lastGood = now;
      const med = median(history);
      $('gauge').classList.remove('idle');
      show(med);
    } else if (now - lastGood > HOLD_MS) {
      history = [];
      inTune = false;
      $('gauge').classList.add('idle');
    }
  }

  function median(a) {
    const s = [...a].sort((x, y) => x - y);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // McLeod Pitch Method (normalised square difference function + key maximum picking).
  function detectPitch(x, sr) {
    const n = x.length;
    const maxTau = Math.min(n - 1, Math.floor(sr / 50));   // down to 50 Hz
    const minTau = Math.max(2, Math.floor(sr / 1500));      // up to 1500 Hz
    const nsdf = new Float32Array(maxTau + 1);
    for (let tau = 0; tau <= maxTau; tau++) {
      let acf = 0, m = 0;
      for (let i = 0, j = tau; j < n; i++, j++) {
        const a = x[i], b = x[j];
        acf += a * b; m += a * a + b * b;
      }
      nsdf[tau] = m > 0 ? (2 * acf) / m : 0;
    }
    const peaks = [];
    let tau = 1;
    while (tau <= maxTau && nsdf[tau] > 0) tau++;
    let inPos = false, best = -1, bestIdx = -1;
    for (; tau <= maxTau; tau++) {
      const v = nsdf[tau];
      if (!inPos && v > 0) { inPos = true; best = v; bestIdx = tau; }
      else if (inPos && v > 0) { if (v > best) { best = v; bestIdx = tau; } }
      else if (inPos && v <= 0) { inPos = false; if (bestIdx >= minTau) peaks.push([bestIdx, best]); }
    }
    if (inPos && bestIdx >= minTau) peaks.push([bestIdx, best]);
    if (!peaks.length) return null;
    let maxPeak = 0;
    for (const p of peaks) if (p[1] > maxPeak) maxPeak = p[1];
    const threshold = 0.9 * maxPeak;
    let chosen = null;
    for (const p of peaks) { if (p[1] >= threshold) { chosen = p; break; } }
    if (!chosen) return null;
    const i = chosen[0];
    let t = i, c = nsdf[i];
    if (i > 0 && i < maxTau) {
      const y0 = nsdf[i - 1], y1 = nsdf[i], y2 = nsdf[i + 1];
      const d = y0 - 2 * y1 + y2;
      if (d !== 0) {
        const delta = 0.5 * (y0 - y2) / d;
        t = i + delta;
        c = y1 - 0.25 * (y0 - y2) * delta;
      }
    }
    return { freq: sr / t, clarity: c };
  }

  // ---------- display ----------
  const needle = $('needle'), noteEl = $('note'), centsEl = $('cents'), hzEl = $('hz'), gaugeEl = $('gauge');
  const levelEl = $('level');
  // Log scale so quiet phone mics still show movement: -60 dBFS -> 0 %, 0 dBFS -> 100 %.
  const levelPct = rms => clamp((20 * Math.log10(Math.max(rms, 1e-6)) + 60) / 60 * 100, 0, 100);
  $('gateMark').style.left = `${levelPct(GATE_RMS)}%`;

  function show(f) {
    let m, cents, targetFreq, stringIdx = -1;
    if (state.mode === 'string') {
      const tg = targets();
      if (locked !== null) {
        stringIdx = locked;
      } else {
        let bestD = Infinity;
        tg.forEach((t, i) => {
          const d = Math.abs(1200 * Math.log2(f / midiToFreq(t)));
          if (d < bestD) { bestD = d; stringIdx = i; }
        });
      }
      m = tg[stringIdx];
      targetFreq = midiToFreq(m);
      cents = 1200 * Math.log2(f / targetFreq);
    } else {
      const exact = freqToMidi(f);
      m = Math.round(exact);
      targetFreq = midiToFreq(m);
      cents = (exact - m) * 100;
    }

    const { name, octave } = noteName(m);
    noteEl.innerHTML = `${name}<sup>${octave}</sup>`;
    const abs = Math.abs(cents);
    inTune = abs <= IN_TUNE;
    const color = inTune ? 'var(--good)' : abs <= NEAR ? 'var(--near)' : 'var(--far)';
    gaugeEl.style.setProperty('--nc', color);
    const shown = clamp(cents, -50, 50);
    needle.style.transform = `rotate(${(shown / 50) * 90}deg)`;
    const rounded = Math.round(cents);
    centsEl.textContent = inTune ? 'In tune' : (rounded > 0 ? `+${rounded} ¢ sharp` : `${rounded} ¢ flat`);
    centsEl.style.color = color;
    hzEl.textContent = `${fmtHz(f)} Hz  ·  target ${fmtHz(targetFreq)} Hz`;

    [...stringsEl.children].forEach((chip, i) => {
      chip.classList.toggle('active', i === stringIdx);
      chip.classList.toggle('tuned', i === stringIdx && inTune);
    });
  }

  function showIdle() {
    noteEl.textContent = '–';
    gaugeEl.style.removeProperty('--nc');
    centsEl.textContent = ' ';
    centsEl.style.color = '';
    hzEl.textContent = ' ';
    needle.style.transform = 'rotate(0deg)';
    [...stringsEl.children].forEach(c => c.classList.remove('active', 'tuned'));
  }

  // ---------- background: sunset, grid horizon, starfield, ridge ----------
  // Lifted from the Vortex 84 site. energy comes from the mic, glow from being in tune.
  (function background() {
    const cv = $('bg'), g2 = cv.getContext('2d');
    let stars = [], ridge = [], phase = 0, last = 0, lastW = 0, lastH = 0;

    function makeStars(W, H) {
      const n = Math.min(160, Math.round(W * H / 9000));
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H * 0.62,
        r: Math.random() * 1.25 + .25, tw: Math.random() * Math.PI * 2,
        sp: Math.random() * 1.8 + .4
      }));
    }
    function makeRidge(W) {
      ridge = [];
      let x = -40, seed = 1337;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      while (x < W + 120) {
        const w = 60 + rnd() * 140;
        ridge.push({ x, w, h: 26 + rnd() * 88 });
        x += w * 0.62;
      }
    }
    // Mix magenta toward green as the string comes into tune.
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const MAG = [255, 45, 149], GRN = [74, 222, 128], CYN = [34, 211, 238];

    function frame(t) {
      const dt = Math.min(0.05, (t - last) / 1000) || 0.016; last = t;
      const DPR = Math.min(devicePixelRatio || 1, 2);
      const W = cv.clientWidth || innerWidth;
      const H = cv.clientHeight || innerHeight;
      const bw = Math.round(W * DPR), bh = Math.round(H * DPR);
      if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
      if (W !== lastW || H !== lastH) { lastW = W; lastH = H; makeStars(W, H); makeRidge(W); }
      g2.setTransform(DPR, 0, 0, DPR, 0, 0);

      glow += ((running && inTune ? 1 : 0) - glow) * 0.08;
      if (!running) energy += (0 - energy) * 0.05;
      const e = energy;
      phase = (phase + dt * (0.10 + e * 0.35 + glow * 0.25)) % 1;

      const hy = H * 0.70;
      const cx = W * 0.5;
      const gridC = mix(CYN, GRN, glow);
      const vertC = mix(MAG, GRN, glow);

      g2.clearRect(0, 0, W, H);

      /* sky */
      const sky = g2.createLinearGradient(0, 0, 0, hy);
      sky.addColorStop(0, '#05020c'); sky.addColorStop(.55, '#170a2e'); sky.addColorStop(1, '#4a1152');
      g2.fillStyle = sky; g2.fillRect(0, 0, W, hy);

      /* stars */
      for (const s of stars) {
        s.tw += dt * s.sp;
        const a = (0.35 + 0.45 * Math.sin(s.tw)) * (0.6 + e * 0.7);
        g2.globalAlpha = Math.max(0, Math.min(1, a));
        g2.fillStyle = '#dbe7ff';
        g2.beginPath(); g2.arc(s.x, s.y, s.r, 0, 6.2832); g2.fill();
      }
      g2.globalAlpha = 1;

      /* sun */
      const R = Math.min(W, H) * 0.17 * (1 + glow * 0.08);
      const sg = g2.createLinearGradient(0, hy - R, 0, hy + R * 0.25);
      sg.addColorStop(0, '#ffe36a'); sg.addColorStop(.45, '#ff6a1f'); sg.addColorStop(1, '#ff2d95');
      g2.save();
      g2.beginPath(); g2.arc(cx, hy, R, Math.PI, 0); g2.closePath(); g2.clip();
      g2.fillStyle = sg; g2.fillRect(cx - R, hy - R, R * 2, R * 1.2);
      g2.fillStyle = 'rgba(10,3,20,.92)';
      for (let i = 0; i < 10; i++) {
        const p = i / 10;
        const y = hy - R + R * Math.pow(p, 0.6) * 1.02;
        g2.fillRect(cx - R, y, R * 2, 2 + p * 7);
      }
      g2.restore();
      g2.globalAlpha = .18 + e * .22 + glow * .15;
      const bl = g2.createRadialGradient(cx, hy, R * .3, cx, hy, R * 2.6);
      bl.addColorStop(0, glow > 0.5 ? '#4ade80' : '#ff6a1f'); bl.addColorStop(1, 'rgba(255,106,31,0)');
      g2.fillStyle = bl; g2.fillRect(0, 0, W, hy + R);
      g2.globalAlpha = 1;

      /* mountain ridge */
      g2.fillStyle = '#180a2b';
      g2.beginPath(); g2.moveTo(-40, hy);
      for (const m of ridge) { g2.lineTo(m.x + m.w * 0.5, hy - m.h); g2.lineTo(m.x + m.w, hy); }
      g2.lineTo(W + 80, hy); g2.closePath(); g2.fill();
      g2.strokeStyle = `rgba(${vertC[0]},${vertC[1]},${vertC[2]},${(0.30 + e * 0.35).toFixed(3)})`;
      g2.lineWidth = 1.2; g2.stroke();

      /* ground */
      const gr = g2.createLinearGradient(0, hy, 0, H);
      gr.addColorStop(0, '#12061f'); gr.addColorStop(1, '#05020c');
      g2.fillStyle = gr; g2.fillRect(0, hy, W, H - hy);

      /* grid: horizontals sliding toward the viewer */
      const ROWS = 18, depth = H - hy;
      g2.lineWidth = 1;
      for (let i = 0; i < ROWS; i++) {
        const p = (i + phase) / ROWS;
        const y = hy + depth * Math.pow(p, 2.7);
        const a = (0.10 + 0.55 * p) * (0.55 + e * 0.7 + glow * 0.3);
        g2.strokeStyle = `rgba(${gridC[0]},${gridC[1]},${gridC[2]},${a.toFixed(3)})`;
        g2.beginPath(); g2.moveTo(0, y); g2.lineTo(W, y); g2.stroke();
      }
      /* grid: verticals converging on the vanishing point */
      const SP = Math.max(60, W / 9);
      for (let k = -14; k <= 14; k++) {
        const a = (0.30 - Math.abs(k) * 0.016) * (0.55 + e * 0.7 + glow * 0.3);
        if (a <= 0) continue;
        g2.strokeStyle = `rgba(${vertC[0]},${vertC[1]},${vertC[2]},${a.toFixed(3)})`;
        g2.beginPath(); g2.moveTo(cx, hy); g2.lineTo(cx + k * SP, H); g2.stroke();
      }
      /* horizon glow line */
      g2.strokeStyle = `rgba(255,255,255,${(0.30 + e * 0.45 + glow * 0.2).toFixed(3)})`;
      g2.lineWidth = 1.4;
      g2.beginPath(); g2.moveTo(0, hy); g2.lineTo(W, hy); g2.stroke();

      if (!REDUCED) requestAnimationFrame(frame);
    }

    if (REDUCED) {
      energy = 0.32;
      frame(performance.now());
      addEventListener('resize', () => frame(performance.now()), { passive: true });
    } else {
      requestAnimationFrame(frame);
    }
  })();

  // ---------- init ----------
  syncControls();
  showIdle();
})();
</script>
</body>
</html>
